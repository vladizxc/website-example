<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/header_footer.css"/>
    <link rel="stylesheet" type="text/css" href="css/responsive/header_footer.css"/>
</head>
<body>
    <header class="container-fluid">
        <div class="container d-flex">
            <img src="/images/main/logo.png" alt="" height="100px">
            <img src="/images/main/burger-menu-icon.png" alt="" class="burger-menu">
            <nav class="menu">
                <a class="active" href="#">Cart</a>
                <a href="#">About</a>
                <a href="#">Buy & Delivery</a>
                <a href="#">Contact</a>
            </nav>
            <form name="search" action="#" method="get">
                <div class="d-flex">
                    <input type="text" name="search" placeholder="Search">
                    <input type="submit" name="search" value="">
                </div>
            </form>
            <div class="cart d-flex">
                <img src="/images/main/cart.png" alt="cart" height="60px">
                <div>
                    <p>100$</p>
                    <a href="#">Buy</a>
                </div>
            </div>
        </div>
    </header>
    <footer class="container-fluid">
        <div class="container d-flex">
            <div class="left d-flex">
                <figure>
                    <img src="/images/main/logo.png" alt="" height="100px">
                    <figcaption>Example Web Site</figcaption>
                </figure>
                <nav>
                    <a class="active" href="#">Cart</a>
                    <a href="#">About</a>
                    <a href="#">Buy & Delivery</a>
                    <a href="#">Confidentiality</a>
                    <a href="#">Contact</a>
                </nav>
            </div>
            <div class="right">
                <form name="search" action="#" method="get">
                    <div class="d-flex">
                        <input type="text" name="search" placeholder="Search">
                        <input type="submit" name="search" value="">
                    </div>
                </form>
                <div>
                    <p>Follow us on social media</p>
                    <a class="box insta" href="#"></a>
                    <a class="box twit" href="#"></a>
                    <a class="box tg" href="#"></a>
                </div> 
            </div>
        </div>
        <div class="container copyright">
            <p>© 2024 All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
